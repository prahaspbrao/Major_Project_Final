version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: ai_dev_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - dev_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: ai_dev_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Express Backend API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai_dev_backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/ai_developer_assistant
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_token_key_for_academic_project_2026
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev_network

  # 4. React Frontend Web Application
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ai_dev_frontend
    restart: always
    networks:
      - dev_network

  # 5. Nginx Reverse Proxy / API Gateway
  nginx:
    image: nginx:1.25-alpine
    container_name: ai_dev_nginx_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - dev_network

volumes:
  mongo_data:
  redis_data:

networks:
  dev_network:
    driver: bridge
